plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shenji.luna'
    compileSdk 36

    defaultConfig {
        applicationId "com.shenji.luna"
        minSdk 24          // 安卓 7.0（API 24）—— 向下兼容到安卓 7
        targetSdk 36       // 安卓 16（API 36）—— 向上兼容到最新；一个包通吃 7/9/12/14/16
        versionCode 108
        versionName "1.2.2-luna"
    }

    signingConfigs {
        fixed {
            storeFile file('luna.keystore')
            storePassword 'luna2026'
            keyAlias 'luna'
            keyPassword 'luna2026'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
